<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvitteringshenter – reklame</title>
<meta name="description" content="Fra tusenvis av bonger til de få som bør undersøkes. Analyseverktøy for Kvitteringsjournalen.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Selve reklamen tegnes i #stage (1920×1080) som skaleres til vinduet. Alt innhold bygges av script.js. -->
<main id="wrap">
  <div id="stage" aria-label="Reklame for Kvitteringshenter">
    <div id="ambient"></div>
    <div id="scenes"></div>
    <div id="fade"></div>
  </div>

  <!-- Start / ferdig-lag (utenfor selve reklamen) -->
  <div id="gate" role="dialog" aria-label="Spill av reklamen">
    <button id="gate-play" class="btn btn-light" type="button"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M2 2l14 8L2 18z" fill="currentColor"/></svg><span>Spill av</span></button>
    <p id="gate-note">Kvitteringshenter · reklame · ca. 40 sekunder</p>
  </div>

  <div id="end" hidden>
    <button id="end-replay" class="btn btn-ghost" type="button">Spill igjen</button>
    <button id="end-demo" class="btn btn-light" type="button">Utforsk demo</button>
  </div>

  <!-- Interaktiv demo (etter reklamen) -->
  <section id="demo" hidden aria-label="Interaktiv demo"></section>

  <!-- Utviklerverktøy: ?dev  (mellomrom = pause, [ ] = forrige/neste scene, 1–9 = hopp, ←/→ = spol) -->
  <div id="dev" hidden>
    <div id="dev-scenes"></div>
    <input id="dev-scrub" type="range" min="0" max="1000" value="0" aria-label="Spol">
    <span id="dev-time">0,0 s</span>
  </div>

  <button id="sound" type="button" aria-pressed="false" title="Lyd av/på" hidden>Lyd: av</button>
</main>
<script src="script.js"></script>
</body>
</html>
